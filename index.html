<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Classroom Logs</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    background: #f4f4f5;
  }
  .tabs {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: #ffffff;
    border-bottom: 1px solid #e4e4e7;
    flex: 0 0 auto;
  }
  .tab {
    flex: 1;
    min-height: 52px;
    font-size: 18px;
    font-weight: 700;
    color: #18181b;
    border: 2px solid #d4d4d8;
    background: #fafafa;
    border-radius: 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active {
    background: #18181b;
    color: #ffffff;
    border-color: #18181b;
  }
  .frames { flex: 1 1 auto; position: relative; min-height: 0; }
  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
    background: #ffffff;
  }
  iframe.active { display: block; }
</style>
</head>
<body>
  <nav class="tabs" role="tablist" aria-label="Classroom logs">
    <button class="tab active" id="tabBathroom" type="button" role="tab" aria-selected="true">Bathroom</button>
    <button class="tab" id="tabLate" type="button" role="tab" aria-selected="false">Late</button>
  </nav>
  <div class="frames">
    <iframe id="frameBathroom" class="active" src="bathroom.html" title="Bathroom log"></iframe>
    <iframe id="frameLate" src="late.html" title="Late log"></iframe>
  </div>
  <script>
    (function () {
      "use strict";
      var KEY = "classroom-logs-active-tab";
      var tabs = {
        bathroom: { tab: document.getElementById("tabBathroom"), frame: document.getElementById("frameBathroom") },
        late: { tab: document.getElementById("tabLate"), frame: document.getElementById("frameLate") }
      };
      function show(which) {
        Object.keys(tabs).forEach(function (k) {
          var on = k === which;
          tabs[k].tab.classList.toggle("active", on);
          tabs[k].tab.setAttribute("aria-selected", on ? "true" : "false");
          tabs[k].frame.classList.toggle("active", on);
        });
        try { localStorage.setItem(KEY, which); } catch (e) { /* private mode: just don't remember */ }
      }
      tabs.bathroom.tab.addEventListener("click", function () { show("bathroom"); });
      tabs.late.tab.addEventListener("click", function () { show("late"); });
      var saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) { /* ignore */ }
      show(saved === "late" ? "late" : "bathroom");
    })();
  </script>
</body>
</html>
